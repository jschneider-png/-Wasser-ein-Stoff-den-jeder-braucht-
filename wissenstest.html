<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wissensüberprüfung – Grundlagen Wasser</title><style>:root{--bg:#f3f7fa;--p:#fff;--ink:#193247;--m:#697b8c;--line:#cbdbe6;--a:#1378c5;--ok:#18864b;--bad:#b83232;--soft:#e8f4fd}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}main{width:min(1000px,calc(100% - 24px));margin:24px auto}.hero,.card{background:var(--p);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:14px}.hero{background:linear-gradient(135deg,#e3f4ff,#fff)}.muted{color:var(--m)}.mode{display:flex;gap:8px;flex-wrap:wrap}button,a{min-height:44px;border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:#fff;color:var(--ink);font-weight:700;cursor:pointer;text-decoration:none}button.primary{background:var(--a);border-color:var(--a);color:#fff}.active{background:var(--soft);border-color:var(--a)}.q{padding:16px;border:1px solid var(--line);border-radius:16px;margin:12px 0;background:#fbfdff}.answers{display:grid;gap:8px;margin-top:10px}.ans{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff}.result{font-size:1.1rem;font-weight:800;padding:16px;border-radius:14px;margin-top:14px}.ok{color:var(--ok)}.bad{color:var(--bad)}@media(max-width:600px){main{width:min(100% - 12px,1000px);margin-top:8px}.hero,.card{padding:14px}}</style></head><body><main><section class="hero"><h1>📝 Wissensüberprüfung – Grundlagen Wasser</h1><p class="muted">Wähle Leicht oder Profi. Die Auswertung erfolgt direkt im Browser.</p><div class="mode"><button id="easy" class="active">🌱 Leicht</button><button id="hard">🧠 Profi</button><a href="index.html">← Zur Lernlandkarte</a></div></section><form id="quiz" class="card"><div id="questions"></div><button class="primary" type="submit">Auswerten</button> <button id="retry" type="button">Neu starten</button><div id="result"></div></form></main><script>
let mode='e';const E=[['Warum ist Wasser lebensnotwendig?',['Es ist nur ein Reinigungsmittel.','Es ist Bestandteil von Lebewesen und für viele Lebensvorgänge nötig.','Es wird nur in der Industrie benötigt.'],1],['Was treibt den natürlichen Wasserkreislauf an?',['Sonnenenergie','Grundwasserpumpen','Straßenverkehr'],0],['Was geschieht bei Kondensation?',['Wasserdampf wird flüssig.','Wasser wird zu Eis.','Eis wird zu Dampf.'],0],['Welche Rohwasserquelle entsteht aus versickertem Niederschlagswasser?',['Grundwasser','Meerwasser','Abwasser'],0],['Wie heißen die drei Aggregatzustände?',['fest, flüssig, gasförmig','warm, kalt, heiß','hart, weich, mittel'],0],['12 °C sind ungefähr …',['285 K','12 K','100 K'],0],['Welche Formel beschreibt die Dichte?',['ρ = m / V','ρ = V / m','ρ = m · V'],0],['Wann hat Wasser seine größte Dichte?',['bei 4 °C','bei 100 °C','bei -20 °C'],0],['Welche Kräfte wirken bei der Kapillarität?',['Adhäsion und Kohäsion','Magnetismus und Strom','Druck und Temperatur'],0],['Welche Summenformel hat chemisch reines Wasser?',['H₂O','CO₂','CaCO₃'],0],['Woraus setzt sich Gesamtwasserhärte zusammen?',['Carbonathärte + Nichtcarbonathärte','Dichte + Volumen','Temperatur + Druck'],0],['Was kann Wasser belasten?',['Nitrate und Pflanzenschutzmittel','nur Sauerstoff','nur Wasserdampf'],0],['Was ist im SHK-Bereich wichtig?',['Trinkwasserqualität bis zur Entnahmestelle erhalten.','Wasser lange stagnieren lassen.','Werkstoffe beliebig auswählen.'],0]];
const H=[['Welche Reihenfolge beschreibt den Wasserkreislauf?',['Verdunstung → Kondensation → Niederschlag → Abfluss/Versickerung','Niederschlag → Sonne → Eis → Dampf','Grundwasser → Kondensation → Sonne'],0],['Was ist Uferfiltrat?',['Oberflächenwasser, das durch Ufer- und Bodenschichten in den Untergrund gelangt.','chemisch reines Wasser','nur Regenwasser'],0],['Gasförmig → flüssig heißt …',['Kondensieren','Schmelzen','Verdampfen'],0],['Was bedeutet 0 K?',['absoluter Nullpunkt','Gefrierpunkt von Wasser','Siedepunkt'],0],['Warum eignet sich Wasser als Wärmeträger?',['Es kann Wärme aufnehmen und transportieren.','Es ist immer 4 °C warm.','Es hat keine Masse.'],0],['1 kg Wasser bei 4 °C und 1 dm³ ergibt welche Dichte?',['1 kg/dm³','4 kg/dm³','0,25 kg/dm³'],0],['Wie heißt die Besonderheit der größten Dichte bei 4 °C?',['Dichteanomalie','Kapillarität','Kondensation'],0],['Warum schwimmt Eis?',['Eis hat geringere Dichte als flüssiges Wasser.','Eis hat höhere Dichte.','Eis ist masselos.'],0],['Was gilt für kommunizierende Gefäße?',['Gleicher Flüssigkeitsspiegel stellt sich ein.','Jedes Gefäß hat anderen Pegel.','Nur das breiteste füllt sich.'],0],['Welche Aussage zur Wasserhärte stimmt?',['Carbonathärte ist temporär/vorübergehend.','Nichtcarbonathärte ist immer temporär.','Gesamthärte besteht nur aus Carbonathärte.'],0],['Was kann bei Erwärmung über 60 °C bzw. Verdunstung ausfallen?',['Calciumcarbonat/Kalkstein','Kochsalz','Sauerstoff'],0],['Welche Aussage beschreibt SHK-Verantwortung?',['Fachgerechte Installation, geeignete Werkstoffe und hygienischer Betrieb schützen Trinkwasser.','Nur Wasserwerke sind verantwortlich.','Stagnation verbessert Trinkwasser.'],0],['Welche Aussage zur Bedeutung von Wasser passt?',['Trinkwasser kann nicht beliebig erzeugt werden; Schutz und sparsamer Umgang sind wichtig.','Trinkwasser ist unbegrenzt künstlich herstellbar.','Nur Pflanzen brauchen Wasser.'],0]];
function render(){let A=mode==='e'?E:H;questions.innerHTML=A.map((q,i)=>`<section class="q"><strong>${i+1}. ${q[0]}</strong><div class="answers">${q[1].map((a,j)=>`<label class="ans"><input type="radio" name="q${i}" value="${j}">${a}</label>`).join('')}</div></section>`).join('');result.innerHTML=''}easy.onclick=()=>{mode='e';easy.classList.add('active');hard.classList.remove('active');render()};hard.onclick=()=>{mode='h';hard.classList.add('active');easy.classList.remove('active');render()};quiz.onsubmit=e=>{e.preventDefault();let A=mode==='e'?E:H,s=0,an=0;A.forEach((q,i)=>{let x=document.querySelector(`input[name=q${i}]:checked`);if(x){an++;if(+x.value===q[2])s++}});let p=Math.round(s/A.length*100);result.className='result '+(p>=70?'ok':'bad');result.innerHTML=`${p>=85?'🏆 Sehr sicher':p>=70?'✅ Gut':p>=50?'📘 Teilweise sicher':'🔁 Wiederholen'}: ${s} von ${A.length} richtig (${p} %).<br><span class="muted">${an<A.length?A.length-an+' Frage(n) nicht beantwortet. ':''}${p<70?'Nutze die Lernlandkarte zur Wiederholung.':'Die Grundlagen sitzen gut.'}</span>`;window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};retry.onclick=()=>{render();window.scrollTo({top:0,behavior:'smooth'})};render();
</script></body></html>
